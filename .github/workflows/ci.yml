name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Physics matrix report
        if: github.ref == 'refs/heads/tooling/physics-matrix-01'
        env:
          POG_PHYSICS_REPORT: "1"
        run: npx vitest run src/physics/physicsMatrix.report.test.ts --reporter=verbose
      - run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
