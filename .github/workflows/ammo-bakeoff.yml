name: POG Ammo Bake-off

on:
  push:
    branches:
      - experiment/ammo-physics-01
    paths:
      - "src/physics/ammoPog.ts"
      - "src/physics/ammoBakeoff.report.test.ts"
      - "src/physics/ammoEnvelope.report.test.ts"
      - "src/physics/realScalePog.ts"
      - ".github/workflows/ammo-bakeoff.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Rapier vs Bullet Ammo real-scale bake-off
        env:
          POG_ENGINE_BAKEOFF: "1"
        run: |
          npx vitest run src/physics/ammoBakeoff.report.test.ts --reporter=verbose
          npx vitest run src/physics/ammoEnvelope.report.test.ts --reporter=verbose
