name: POG Bullet Bakeoff

on:
  push:
    branches:
      - experiment/bullet-bakeoff-01
    paths:
      - "src/physics/bulletPog.ts"
      - "src/physics/realScalePog.ts"
      - "src/physics/bulletBakeoff.report.test.ts"
      - "package.json"
      - ".github/workflows/bullet-bakeoff.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Rapier vs Bullet bakeoff
        env:
          POG_BULLET_BAKEOFF: "1"
        run: npx vitest run src/physics/bulletBakeoff.report.test.ts --reporter=verbose
